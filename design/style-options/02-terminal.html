<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 终端 · XMemeory 风格预览</title>
<style>
:root{--bg:#0b0f0c;--panel:#101611;--line:#1f2b22;--fg:#c8e6c9;--dim:#5f7a63;--green:#5af78e;--amber:#ffb454;--mark:#ffe14d;--mono:"JetBrains Mono","Cascadia Code",Consolas,"Microsoft YaHei Mono","Microsoft YaHei",monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.6 var(--mono)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
mark{background:var(--mark);color:#1f1a00}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;gap:8px;align-items:center}
.brand-mark{color:var(--bg);background:var(--green);padding:0 6px;font-weight:700}
.brand-name{color:var(--green)}
.brand-name::after{content:"_";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.search-all{display:flex;justify-content:space-between;border:1px dashed var(--line);padding:6px 8px;color:var(--dim)}
.search-all span::before{content:"$ "}
kbd{font:inherit;color:var(--amber)}
.nav{display:flex;flex-direction:column}
.nav-item{display:flex;justify-content:space-between;padding:4px 8px;color:var(--dim)}
.nav-item::before{content:"  ";white-space:pre}
.nav-item.on{color:var(--green);background:#13221a}
.nav-item.on::before{content:"> ";white-space:pre}
.nav-name{flex:1}
.nav-count{color:var(--amber)}
.motto{color:var(--dim);font-size:12px}
.motto::before{content:"# "}
.side-foot{margin-top:auto;display:flex;flex-direction:column}
.local{color:var(--dim);font-size:11px;padding:8px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line)}
.page-title{font-size:15px;display:flex;gap:10px;color:var(--green)}
.page-title span::before{content:"~/";color:var(--dim)}
.page-count{color:var(--amber);font-size:12px}
.page-count::before{content:"["}.page-count::after{content:"]"}
.partial-link{color:var(--amber);font-size:12px}
.partial-link::before{content:"! "}
.search{margin-left:auto;display:flex;gap:8px;align-items:center;border:1px solid var(--line);padding:4px 10px;width:360px;background:#070a08}
.search-icon{color:var(--green)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--fg);font:inherit;caret-color:var(--green)}
.status{display:flex;align-items:center;gap:10px;padding:6px 18px;border-bottom:1px solid var(--line);color:var(--dim);font-size:12px;position:relative}
.status-dot{width:8px;height:8px;background:var(--green);box-shadow:0 0 8px var(--green)}
.status .btn{margin-left:auto}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--line)}
.progress i{display:block;height:100%;width:6%;background:var(--green)}
.btn{border:1px solid var(--line);padding:1px 10px;color:var(--fg)}
.btn::before{content:"[ "}.btn::after{content:" ]"}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.ghost{border-color:transparent}
.body{flex:1;display:grid;grid-template-columns:400px 1fr;min-height:0}
.list{overflow:auto;border-right:1px solid var(--line)}
.list-head{display:flex;justify-content:space-between;padding:8px 16px;color:var(--dim);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
.eyebrow{color:var(--dim)}
.eyebrow::before{content:"// "}
.list-count{color:var(--amber)}
.card{display:block;width:100%;padding:10px 16px;border-bottom:1px solid var(--line);position:relative}
.card:hover{background:#0f1611}
.card.on{background:#13221a}
.card.on::before{content:"▌";position:absolute;left:2px;top:10px;color:var(--green)}
.card-meta{display:flex;gap:12px;font-size:12px}
.card-author{color:var(--amber)}
.card-date{color:var(--dim)}
.card-title{font-size:14px;color:var(--green);font-weight:600;margin:3px 0}
.card-snippet{color:var(--fg);opacity:.8;font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tag{font-size:11px;color:var(--dim)}
.card-tag::before{content:"#"}
.card-tag.warn{color:#ff6b6b}
.empty{padding:20px 16px;color:var(--dim)}
.detail{overflow:auto;padding:16px 40px 50px}
.actions{display:flex;gap:6px;align-items:center;margin-bottom:24px}
.saved{margin-left:auto;color:var(--green);font-size:12px}
.saved::before{content:"✓ "}
.doc-title{font-size:24px;color:var(--green);margin:6px 0;line-height:1.35}
.doc-title::before{content:"# ";color:var(--dim)}
.doc-meta{color:var(--dim);border-bottom:1px dashed var(--line);padding-bottom:14px}
.doc-body{max-width:760px;padding-top:16px;font-size:14px;line-height:1.85}
.doc-body p,.doc-body ul{margin:0 0 14px}
.doc-body h2{font-size:15px;color:var(--amber);margin:22px 0 8px}
.doc-body h2::before{content:"## ";color:var(--dim)}
.section-label{color:var(--dim)!important;font-size:12px!important}
.section-label::before{content:"--- "!important}
.section-label::after{content:" ---"}
.doc-body ul{list-style:none;padding:0}
.doc-body li::before{content:"- ";color:var(--green)}
blockquote{border-left:2px solid var(--green);padding:6px 14px;margin:16px 0;color:var(--green)}
blockquote::before{content:"> "}
.my-note{border:1px dashed var(--amber);padding:10px 14px;color:var(--amber)}
.doc-foot{display:flex;justify-content:space-between;margin-top:30px;color:var(--dim);font-size:11px;border-top:1px solid var(--line);padding-top:8px}
</style>
</head>
<body>
<script src="app.js"></script>
</body>
</html>
