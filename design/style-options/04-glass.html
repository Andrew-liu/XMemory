<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04 极光玻璃 · XMemeory 风格预览</title>
<style>
:root{--fg:#f3f1ff;--dim:rgba(243,241,255,.62);--glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.14);--edge:rgba(255,255,255,.18);--accent:#9d8cff;--mark:#ffe14d;--font:"Inter","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{color:var(--fg);font:14px/1.6 var(--font);background:#120d2b;overflow:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 40% at 20% 20%,#6a3df5 0,transparent 70%),radial-gradient(35% 35% at 80% 30%,#0fb3c9 0,transparent 70%),radial-gradient(45% 45% at 60% 90%,#e0457b 0,transparent 70%);filter:blur(40px);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) rotate(8deg)}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
mark{background:var(--mark);color:#1f1a00;border-radius:3px;padding:0 2px}
.app{display:grid;grid-template-columns:240px 1fr;height:100vh;gap:16px;padding:16px}
.panel,.side,.top,.status,.list,.detail{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.15)}
.side{padding:20px 16px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#9d8cff,#36d1dc);box-shadow:0 4px 16px rgba(157,140,255,.6)}
.brand-name{font-size:17px}
.search-all{display:flex;justify-content:space-between;background:var(--glass);border:1px solid var(--edge);border-radius:12px;padding:8px 12px;color:var(--dim)}
kbd{font:11px var(--font);background:var(--glass2);border-radius:6px;padding:1px 6px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;justify-content:space-between;padding:9px 12px;border-radius:12px;color:var(--dim)}
.nav-item:hover{background:var(--glass)}
.nav-item.on{background:var(--glass2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--edge)}
.nav-count{font-size:12px;opacity:.8}
.motto{font-size:12px;color:var(--dim)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.local{font-size:11px;color:var(--dim);padding:8px 12px}
.main{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:16px;padding:12px 20px}
.page-title{font-size:24px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.page-count{font-size:13px;color:var(--dim);font-weight:400}
.partial-link{font-size:12px;color:#ffb3c7;background:rgba(224,69,123,.2);border-radius:99px;padding:3px 10px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;width:380px;background:rgba(0,0,0,.2);border:1px solid var(--edge);border-radius:99px;padding:7px 16px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--fg);font:inherit}
.search input::placeholder{color:var(--dim)}
.status{display:flex;align-items:center;gap:10px;padding:8px 20px;font-size:12px;color:var(--dim);position:relative;overflow:hidden;border-radius:14px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#5cf2c4;box-shadow:0 0 12px #5cf2c4}
.status .btn{margin-left:auto}
.progress{position:absolute;left:0;right:0;bottom:0;height:2px}
.progress i{display:block;height:100%;width:6%;background:linear-gradient(90deg,#9d8cff,#36d1dc)}
.btn{background:var(--glass2);border:1px solid var(--edge);border-radius:99px;padding:5px 14px;font-size:12px;color:var(--fg)}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.ghost{background:none;border-color:transparent}
.body{flex:1;display:grid;grid-template-columns:380px 1fr;gap:12px;min-height:0}
.list{overflow:auto;padding:8px}
.list-head{display:flex;justify-content:space-between;padding:8px 10px;font-size:12px;color:var(--dim)}
.card{display:block;width:100%;padding:12px 14px;border-radius:14px;margin-bottom:4px;transition:background .2s}
.card:hover{background:var(--glass)}
.card.on{background:linear-gradient(135deg,rgba(157,140,255,.32),rgba(54,209,220,.18));box-shadow:inset 0 0 0 1px var(--edge)}
.card-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.card-title{font-size:15px;font-weight:600;margin:4px 0;line-height:1.4}
.card-snippet{font-size:13px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tag{display:inline-block;margin-top:6px;font-size:11px;background:var(--glass2);border-radius:99px;padding:0 8px}
.card-tag.warn{background:rgba(224,69,123,.3);color:#ffd0dc}
.empty{padding:30px 10px;color:var(--dim)}
.detail{overflow:auto;padding:20px 48px 50px}
.actions{display:flex;gap:8px;align-items:center;margin-bottom:28px}
.saved{margin-left:auto;font-size:12px;color:#5cf2c4}
.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase}
.doc-title{font-size:34px;line-height:1.25;font-weight:700;margin:8px 0;background:linear-gradient(90deg,#fff,#cfc6ff);-webkit-background-clip:text;background-clip:text}
.doc-title mark{-webkit-text-fill-color:#1f1a00}
.doc-meta{color:var(--dim);padding-bottom:18px;border-bottom:1px solid var(--edge)}
.doc-body{max-width:760px;padding-top:18px;font-size:15.5px;line-height:1.85}
.doc-body p,.doc-body ul{margin:0 0 14px}
.doc-body h2{font-size:19px;margin:24px 0 8px}
.section-label{font-size:11px!important;letter-spacing:.2em;color:var(--accent)}
blockquote{margin:20px 0;padding:16px 20px;border-radius:16px;background:var(--glass2);border:1px solid var(--edge);font-size:17px}
.my-note{padding:14px 18px;border-radius:16px;background:rgba(92,242,196,.1);border:1px solid rgba(92,242,196,.3)}
.doc-foot{display:flex;justify-content:space-between;margin-top:30px;font-size:11px;color:var(--dim)}
</style>
</head>
<body>
<script src="app.js"></script>
</body>
</html>
