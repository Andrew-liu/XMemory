<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06 手账卡片 · XMemeory 风格预览</title>
<style>
:root{--desk:#e9e2d3;--kraft:#c9a97a;--paper:#fffdf6;--ink:#2f3a4a;--muted:#8a8172;--grid:#e6ecf3;--teal:#2f8f83;--coral:#e8694a;--mark:#ffe14d;--hand:"Kalam","KaiTi","STKaiti","楷体",cursive;--font:"Nunito","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font:14px/1.6 var(--font)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
mark{background:var(--mark);color:#1f1a00;border-radius:2px 6px 3px 5px;padding:0 2px;box-decoration-break:clone}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh}
.side{background:var(--kraft) repeating-linear-gradient(45deg,rgba(0,0,0,.025) 0 2px,transparent 2px 6px);padding:22px 16px;display:flex;flex-direction:column;gap:16px;border-right:2px dashed rgba(0,0,0,.18);color:#3d2f1d}
.brand{display:flex;align-items:center;gap:8px}
.brand-mark{background:var(--paper);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font:700 15px var(--hand);color:var(--coral);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.brand-name{font:700 21px var(--hand)}
.search-all{display:flex;justify-content:space-between;background:var(--paper);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--muted);box-shadow:0 2px 0 rgba(0,0,0,.12)}
kbd{font:10px var(--font)}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-item{display:flex;justify-content:space-between;padding:7px 12px;border-radius:4px 14px 14px 4px;font:600 17px var(--hand)}
.nav-item:hover{background:rgba(255,255,255,.3)}
.nav-item.on{background:var(--paper);box-shadow:2px 3px 0 rgba(0,0,0,.15);transform:rotate(-1deg)}
.nav-count{font:12px var(--font);color:var(--muted)}
.motto{font:15px/1.7 var(--hand);background:#fff7b8;padding:12px;transform:rotate(1.5deg);box-shadow:2px 3px 0 rgba(0,0,0,.12)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.side-foot .nav-item{font-size:14px}
.local{font-size:11px;padding:6px 12px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:16px;padding:18px 28px 10px}
.page-title{font:700 34px var(--hand);display:flex;align-items:baseline;gap:8px}
.page-title span{background:linear-gradient(transparent 60%,rgba(47,143,131,.3) 60%)}
.page-count{font:13px var(--font);color:var(--muted)}
.partial-link{font:600 14px var(--hand);color:var(--coral);border:2px solid var(--coral);border-radius:20px 14px 18px 12px;padding:0 10px;transform:rotate(-2deg)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:12px;padding:7px 14px;width:360px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;color:var(--ink)}
.status{display:flex;align-items:center;gap:10px;margin:0 28px;padding:6px 14px;background:rgba(255,253,246,.6);border-radius:10px;font-size:12px;color:var(--muted);position:relative;overflow:hidden}
.status-dot{width:9px;height:9px;border-radius:50%;background:var(--teal)}
.status .btn{margin-left:auto}
.progress{position:absolute;left:0;right:0;bottom:0;height:3px}
.progress i{display:block;height:100%;width:6%;background:var(--teal);border-radius:3px}
.btn{background:var(--paper);border:1.5px solid var(--ink);border-radius:14px 10px 12px 9px;padding:2px 12px;font-size:12px;box-shadow:1px 2px 0 var(--ink)}
.btn.ghost{border-color:transparent;box-shadow:none;background:none}
.body{flex:1;display:grid;grid-template-columns:380px 1fr;gap:20px;min-height:0;padding:16px 28px 20px}
.list{overflow:auto;padding:4px 10px 20px 4px;display:flex;flex-direction:column;gap:14px}
.list-head{display:flex;justify-content:space-between;align-items:baseline}
.eyebrow{font:600 16px var(--hand);color:var(--teal)}
.list-count{font-size:12px;color:var(--muted)}
.card{display:block;width:100%;background:var(--paper);padding:16px 16px 12px;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.08),2px 4px 10px rgba(0,0,0,.08);position:relative;transition:transform .15s}
.card:nth-child(odd){transform:rotate(-.5deg)}
.card:nth-child(even){transform:rotate(.6deg)}
.card:hover{transform:rotate(0) translateY(-2px)}
.card::before{content:"";position:absolute;top:-8px;left:40%;width:64px;height:18px;background:rgba(232,105,74,.35);transform:rotate(-3deg)}
.card:nth-child(3n)::before{background:rgba(47,143,131,.35)}
.card.on{outline:2.5px solid var(--teal);outline-offset:3px}
.card-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.card-author{font:600 14px var(--hand);color:var(--teal)}
.card-title{font-size:15.5px;font-weight:700;margin:4px 0;line-height:1.4}
.card-snippet{font-size:13px;color:#5a6474;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tag{display:inline-block;margin-top:6px;font:600 13px var(--hand);color:var(--muted)}
.card-tag::before{content:"✎ "}
.card-tag.warn{color:var(--coral)}
.empty{font:18px var(--hand);color:var(--muted)}
.detail{overflow:auto;background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;border-radius:4px;box-shadow:2px 4px 14px rgba(0,0,0,.1);padding:22px 48px 50px 64px;position:relative}
.detail::before{content:"";position:absolute;left:36px;top:0;bottom:0;width:2px;background:rgba(232,105,74,.4)}
.actions{display:flex;gap:10px;align-items:center;margin-bottom:24px}
.saved{margin-left:auto;font:600 14px var(--hand);color:var(--teal)}
.detail>.eyebrow{font-size:18px}
.doc-title{font-size:30px;font-weight:800;line-height:1.3;margin:4px 0 8px}
.doc-meta{font:15px var(--hand);color:var(--muted);margin-bottom:20px}
.doc-body{max-width:720px;font-size:15px;line-height:24px}
.doc-body p,.doc-body ul{margin:0 0 24px}
.doc-body h2{font:700 20px/24px var(--hand);margin:24px 0;color:var(--teal)}
.section-label{display:inline-block;background:#fff7b8;padding:0 10px;transform:rotate(-1.5deg);color:var(--ink)!important;box-shadow:1px 2px 0 rgba(0,0,0,.1)}
blockquote{font:20px/1.5 var(--hand);margin:24px 0;padding:14px 18px;background:rgba(47,143,131,.08);border-left:4px solid var(--teal);border-radius:0 12px 12px 0}
.my-note{font:17px/1.6 var(--hand);background:#fff7b8;padding:14px 18px;transform:rotate(-.6deg);box-shadow:2px 3px 0 rgba(0,0,0,.12)}
.doc-foot{display:flex;justify-content:space-between;margin-top:30px;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<script src="app.js"></script>
</body>
</html>
