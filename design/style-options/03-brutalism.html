<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 新粗野 · XMemeory 风格预览</title>
<style>
:root{--bg:#f4f0e6;--ink:#000;--pink:#ff6bd6;--blue:#3d5afe;--lime:#b6ff3b;--orange:#ff7a1a;--mark:#ffe14d;--font:"Space Grotesk","Arial Black","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
mark{background:var(--mark);color:#1f1a00;outline:2px solid var(--ink);padding:0 2px}
.app{display:grid;grid-template-columns:230px 1fr;height:100vh;gap:14px;padding:14px}
.side{background:var(--lime);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:8px}
.brand-mark{background:var(--ink);color:var(--lime);font-weight:900;padding:4px 8px;transform:rotate(-6deg)}
.brand-name{font-size:22px;font-weight:900;letter-spacing:-.04em}
.search-all{display:flex;justify-content:space-between;background:#fff;border:3px solid var(--ink);padding:8px 10px;font-weight:700}
kbd{font:700 11px var(--font);background:var(--ink);color:#fff;padding:1px 5px}
.nav{display:flex;flex-direction:column;gap:8px}
.nav-item{display:flex;justify-content:space-between;align-items:center;background:#fff;border:3px solid var(--ink);padding:8px 10px;font-weight:800;font-size:16px}
.nav-item:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.nav-item.on{background:var(--pink);box-shadow:4px 4px 0 var(--ink)}
.nav-count{background:var(--ink);color:#fff;padding:0 6px;font-size:12px}
.motto{font-weight:700;font-size:13px;border-top:3px solid var(--ink);padding-top:10px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.side-foot .nav-item{font-size:13px;padding:5px 10px}
.local{font-size:11px;font-weight:700;text-transform:uppercase}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;gap:14px}
.top{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:12px 18px}
.page-title{font-size:40px;font-weight:900;letter-spacing:-.05em;display:flex;align-items:center;gap:10px;line-height:1}
.page-count{font-size:14px;background:var(--blue);color:#fff;padding:2px 8px;border:3px solid var(--ink);letter-spacing:0}
.partial-link{background:var(--orange);border:3px solid var(--ink);padding:3px 10px;font-weight:800;font-size:12px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;border:3px solid var(--ink);padding:6px 10px;width:360px;background:var(--bg)}
.search-icon{font-size:20px;font-weight:900}
.search input{flex:1;border:0;outline:0;background:none;font:700 15px var(--font)}
.status{display:flex;align-items:center;gap:12px;background:var(--blue);color:#fff;border:3px solid var(--ink);padding:8px 16px;font-weight:700;position:relative;overflow:hidden}
.status-dot{width:14px;height:14px;background:var(--lime);border:3px solid var(--ink);border-radius:50%}
.status .btn{margin-left:auto;color:var(--ink)}
.progress{position:absolute;left:0;bottom:0;right:0;height:5px;background:rgba(0,0,0,.3)}
.progress i{display:block;height:100%;width:6%;background:var(--lime)}
.btn{background:#fff;border:3px solid var(--ink);padding:4px 12px;font-weight:800;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.ghost{background:var(--lime)}
.body{flex:1;display:grid;grid-template-columns:390px 1fr;gap:14px;min-height:0}
.list{overflow:auto;padding:0 10px 10px 0;display:flex;flex-direction:column;gap:12px}
.list-head{display:flex;justify-content:space-between;align-items:center;font-weight:900;text-transform:uppercase;position:sticky;top:0;background:var(--bg);padding-bottom:4px;z-index:1}
.list-count{background:var(--ink);color:#fff;padding:1px 8px;font-size:12px}
.card{display:block;width:100%;background:#fff;border:3px solid var(--ink);padding:12px 14px;box-shadow:5px 5px 0 var(--ink);transition:transform .08s}
.card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.card.on{background:var(--mark)}
.card.on mark{background:#fff}
.card-meta{display:flex;justify-content:space-between;font-size:12px;font-weight:800}
.card-author{background:var(--pink);border:2px solid var(--ink);padding:0 6px}
.card-title{font-size:18px;font-weight:900;line-height:1.25;margin:8px 0 6px;letter-spacing:-.02em}
.card-snippet{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tag{display:inline-block;margin-top:8px;border:2px solid var(--ink);padding:0 6px;font-size:11px;font-weight:800;background:var(--lime)}
.card-tag.warn{background:var(--orange)}
.empty{font-weight:900;font-size:20px}
.detail{overflow:auto;background:#fff;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:20px 40px 50px}
.actions{display:flex;gap:10px;align-items:center;margin-bottom:28px;flex-wrap:wrap}
.saved{margin-left:auto;font-weight:800;font-size:12px;background:var(--lime);border:2px solid var(--ink);padding:1px 8px}
.eyebrow{font-weight:900;text-transform:uppercase;font-size:12px}
.detail>.eyebrow{background:var(--ink);color:#fff;padding:2px 8px}
.doc-title{font-size:44px;font-weight:900;line-height:1.05;letter-spacing:-.04em;margin:14px 0}
.doc-meta{font-weight:700;border-bottom:3px solid var(--ink);padding-bottom:14px}
.doc-body{max-width:760px;padding-top:18px;font-size:16px;line-height:1.75}
.doc-body p,.doc-body ul{margin:0 0 14px}
.doc-body h2{font-size:24px;font-weight:900;margin:26px 0 10px;letter-spacing:-.03em}
.section-label{display:inline-block;font-size:13px!important;background:var(--pink);border:3px solid var(--ink);padding:2px 10px}
blockquote{background:var(--blue);color:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:16px 20px;font-size:20px;font-weight:800;margin:20px 0}
.my-note{background:var(--lime);border:3px dashed var(--ink);padding:12px 16px;font-weight:600}
.doc-foot{display:flex;justify-content:space-between;margin-top:30px;border-top:3px solid var(--ink);padding-top:10px;font-weight:800;font-size:12px}
</style>
</head>
<body>
<script src="app.js"></script>
</body>
</html>
